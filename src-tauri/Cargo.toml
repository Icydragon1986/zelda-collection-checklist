[package]
name = "zelda-collection-checklist"
version = "1.1.0"
description = "Checklist personnelle pour les collections The Legend of Zelda"
authors = ["Icydragon1986"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "tauri_app_lib"
# L'application distribuée est exclusivement Windows. Les sorties staticlib et
# cdylib du modèle mobile Tauri ajoutaient deux liaisons lourdes et inutiles.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2.4.4"
tauri-plugin-fs = "2.5.1"
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
