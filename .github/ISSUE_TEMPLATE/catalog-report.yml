name: Erreur ou produit manquant / Error or missing product
description: Signaler une fiche, une image ou un produit Zelda à corriger ou ajouter.
title: "[Catalogue] "
labels: ["catalogue"]
body:
  - type: dropdown
    id: report-type
    attributes:
      label: Type de signalement / Report type
      options:
        - Produit manquant / Missing product
        - Information incorrecte / Incorrect information
        - Image incorrecte ou manquante / Incorrect or missing image
        - Autre / Other
    validations:
      required: true
  - type: input
    id: product
    attributes:
      label: Produit concerné / Product
      placeholder: Nom, console et région / Name, platform and region
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Détails / Details
      description: Expliquez la correction et ajoutez une source fiable si possible.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources ou photos / Sources or photos
      description: Liens officiels, archives, photos de votre exemplaire, etc.
