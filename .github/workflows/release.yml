name: Publier une version

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          cache-on-failure: true
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler et publier
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Zelda Collection Checklist v__VERSION__"
          releaseBody: "Audit amiibo régional : 15 emballages PAL et japonais ajoutés en haute qualité, dont Zelda, Ganondorf, les quatre Sages, Link's Awakening et Zelda & Loftwing. Les visuels restent entièrement locaux et consultables hors ligne."
          releaseDraft: false
          prerelease: false
