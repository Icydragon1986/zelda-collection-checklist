name: Publier une version

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler et publier
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: "Zelda Collection Checklist v__VERSION__"
          releaseBody: "Grand audit physique : 39 variantes de jeux et 2 bundles Game Boy ajoutés, emballages amiibo régionaux fiabilisés, nouvelles jaquettes locales et compilation GitHub accélérée par cache Rust."
          releaseDraft: false
          prerelease: false
